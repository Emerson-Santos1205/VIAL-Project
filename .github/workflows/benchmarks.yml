name: benchmarks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tiktoken

      - name: Benchmark RFC-007 (Selective Context)
        run: python benchmark/selective-context/run_benchmark.py --out results/_ci

      - name: Benchmark RFC-008 (Cognitive Reuse)
        run: python benchmark/cognitive-reuse/run_benchmark.py --out results/_ci

      - name: Benchmark RFC-009 (Failure & Recovery)
        run: python benchmark/failure-recovery/run_benchmark.py --out results/_ci

      - name: Benchmark RFC-010 (Economic Cost)
        run: python benchmark/economic-cost/run_benchmark.py --out results/_ci

      - name: Assert all hypotheses supported
        run: |
          python - <<'EOF'
          import json, pathlib
          fails = []
          # RFC-007 reports verdict.h1_supported; RFC-008/009/010 report
          # verdict.hypotheses_supported.
          checks = {
              "RFC-007": ("benchmark/selective-context/results/_ci", "h1_supported"),
              "RFC-008": ("benchmark/cognitive-reuse/results/_ci", "hypotheses_supported"),
              "RFC-009": ("benchmark/failure-recovery/results/_ci", "hypotheses_supported"),
              "RFC-010": ("benchmark/economic-cost/results/_ci", "hypotheses_supported"),
          }
          for rfc, (path, key) in checks.items():
              reports = sorted(pathlib.Path(path).glob("*/report.json"))
              if not reports:
                  fails.append(f"{rfc}: no report found")
                  continue
              report = json.loads(reports[-1].read_text())
              ok = report["verdict"].get(key)
              if not ok:
                  fails.append(f"{rfc}: {key} = false")
          if fails:
              raise SystemExit("\n".join(fails))
          print("All RFC-007..010 hypotheses supported.")
          EOF

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports-py${{ matrix.python-version }}
          path: benchmark/*/results/_ci/

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tiktoken

      - name: Run full repository audit
        run: python audit/run_all.py --full

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vial-audit-report
          path: audit/results/latest.json
