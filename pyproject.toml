[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vial-prototype"
version = "0.1.0"
description = "Minimal reference implementation of the VIAL platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "VIAL contributors" }]

[tool.setuptools.packages.find]
include = ["prototype*"]
